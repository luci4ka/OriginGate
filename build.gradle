plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'io.github.origingate'
version = providers.gradleProperty('version').get()

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def velocityApi = 'com.velocitypowered:velocity-api:3.4.0-20260121.190037-118'

dependencies {
    compileOnly velocityApi
    annotationProcessor velocityApi

    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    implementation('org.mariadb.jdbc:mariadb-java-client:3.5.10') {
        transitive = false
    }
    implementation 'com.maxmind.db:maxmind-db:4.2.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.bstats:bstats-velocity:3.2.1'
    implementation 'net.kyori:adventure-text-minimessage:4.26.1'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.26.1'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def sqliteNatives = [
        'Linux/x86_64', 'Linux/aarch64', 'Linux-Musl/x86_64', 'Linux-Musl/aarch64',
        'Windows/x86_64', 'Windows/aarch64', 'Mac/x86_64', 'Mac/aarch64'
]

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName = 'OriginGate-Velocity'
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    relocate 'org.yaml.snakeyaml', 'io.github.origingate.internal.snakeyaml'
    relocate 'org.mariadb.jdbc', 'io.github.origingate.internal.mariadb'
    relocate 'com.google.gson', 'io.github.origingate.internal.gson'
    relocate 'org.bstats', 'io.github.origingate.internal.bstats'
    relocate 'com.maxmind.db', 'io.github.origingate.internal.maxmind'
    dependencies {
        exclude(dependency('net.kyori:.*'))
    }
    exclude 'module-info.class'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude { file ->
        def path = file.relativePath.pathString
        path.startsWith('org/sqlite/native/') && !file.isDirectory
                && sqliteNatives.every { !path.startsWith("org/sqlite/native/${it}/") }
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

def generateBuildInfo = tasks.register('generateBuildInfo') {
    def output = layout.buildDirectory.dir('generated/sources/buildinfo')
    def version = project.version.toString()
    inputs.property 'version', version
    outputs.dir output
    doLast {
        def file = output.get().file('io/github/origingate/core/BuildInfo.java').asFile
        file.parentFile.mkdirs()
        file.write("""
            |package io.github.origingate.core;
            |
            |/** Generated by the build from gradle.properties. */
            |public final class BuildInfo {
            |    public static final String VERSION = "${version}";
            |
            |    private BuildInfo() { }
            |}
            |""".stripMargin())
    }
}
sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/sources/buildinfo'))

tasks.named('compileJava') {
    dependsOn generateBuildInfo
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('velocity-plugin.json') {
        expand 'version': project.version
    }
}